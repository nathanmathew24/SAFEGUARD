version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: docuflow
      POSTGRES_USER: docuflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: gunicorn -w 4 -b 0.0.0.0:5000 run:app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://docuflow:${POSTGRES_PASSWORD:-changeme}@db:5432/docuflow
      REDIS_URL: redis://redis:6379/0
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "5000"
    volumes:
      - uploads:/data/uploads

  worker:
    build: .
    restart: unless-stopped
    command: celery -A worker.celery worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql://docuflow:${POSTGRES_PASSWORD:-changeme}@db:5432/docuflow
      REDIS_URL: redis://redis:6379/0
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads

  beat:
    build: .
    restart: unless-stopped
    command: celery -A worker.celery beat --loglevel=info --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment:
      DATABASE_URL: postgresql://docuflow:${POSTGRES_PASSWORD:-changeme}@db:5432/docuflow
      REDIS_URL: redis://redis:6379/0
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
